<!-- Backdrop -->
<div
  *ngIf="isOpen"
  class="fixed inset-0 bg-black/25 z-[999]"
  (click)="close()"
></div>

<!-- Drawer -->
<div
  *ngIf="isOpen"
  class="fixed top-0 right-0 w-[380px] h-full bg-white shadow-xl z-[1000] flex flex-col animate-slide-in overflow-y-auto"
>
  <!-- Header -->
  <div class="flex justify-between items-center p-4 border-b">
    <h2 class="text-lg font-semibold">Your Cart 🛒</h2>
    <button
      class="text-xl cursor-pointer hover:text-gray-600"
      (click)="close()"
    >
      ✕
    </button>
  </div>

  <!-- Items -->
  <div class="p-4 space-y-4">
    <div class="flex items-center" *ngFor="let item of cartItems">
      <img
        [src]="item.productThumbnail"
        [alt]="item.productName"
        class="w-16 h-16 object-cover rounded-md mr-3"
      />

      <div class="flex-1">
        <h4 class="font-medium text-gray-800">{{ item.productName }}</h4>
        <p class="text-sm text-gray-600">₹{{ item.productPrice }}</p>

        <!-- Quantity -->
        <div class="flex items-center space-x-2 my-2">
          <button
            class="px-2 py-1 border rounded bg-gray-100 disabled:opacity-50"
            (click)="updateQuantity(item, item.quantity - 1)"
            [disabled]="item.quantity <= 1"
          >
            -
          </button>
          <span class="px-2">{{ item.quantity }}</span>
          <button
            class="px-2 py-1 border rounded bg-gray-100"
            (click)="updateQuantity(item, item.quantity + 1)"
          >
            +
          </button>
        </div>

        <!-- Remove -->
        <button
          class="text-red-500 text-xs hover:underline"
          (click)="remove(item)"
        >
          Remove
        </button>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <div class="mt-auto p-4 border-t">
    <p class="text-gray-800 font-medium mb-3">Total: ₹{{ totalAmount }}</p>
    <button
      class="w-full bg-black text-white py-3 rounded-md hover:bg-gray-800 transition"
    >
      Checkout
    </button>
  </div>
</div>
