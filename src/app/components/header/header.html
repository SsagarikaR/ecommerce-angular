<header class="w-full sticky top-0 z-40 bg-white border-b">
  <div
    class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3 flex items-center gap-3"
  >
    <a routerLink="/" class="shrink-0 flex items-center gap-2">
      <div class="w-8 h-8 rounded-full bg-gray-900"></div>
      <span class="font-semibold text-lg">ShopMate</span>
    </a>

    <form
      class="flex-1"
      (submit)="$event.preventDefault(); onSearch(searchInput.value)"
    >
      <label class="sr-only" for="site-search">Search</label>
      <div
        class="flex items-stretch rounded-xl border overflow-hidden focus-within:ring-2 focus-within:ring-gray-900"
      >
        <input
          #searchInput
          id="site-search"
          type="search"
          placeholder="Search for products, brands and more"
          class="w-full px-3 py-2 outline-none"
        />
        <button type="submit" class="px-3 py-2 border-l hover:bg-gray-50">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="h-5 w-5"
            viewBox="0 0 24 24"
            fill="none"
          >
            <path
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              d="m21 21-4.35-4.35M10.5 18a7.5 7.5 0 1 1 0-15 7.5 7.5 0 0 1 0 15Z"
            />
          </svg>
        </button>
      </div>
    </form>

    <a
      routerLink="/account"
      class="shrink-0 inline-flex items-center gap-2 px-3 py-2 rounded-lg hover:bg-gray-50"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        class="h-5 w-5"
        viewBox="0 0 24 24"
        fill="none"
      >
        <path
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M16 7a4 4 0 1 1-8 0 4 4 0 0 1 8 0ZM4 20a8 8 0 1 1 16 0v1H4v-1Z"
        />
      </svg>
      <span class="hidden sm:inline">Profile</span>
    </a>
    <a
      routerLink="/cart"
      class="shrink-0 inline-flex items-center gap-2 px-3 py-2 rounded-lg hover:bg-gray-50 relative"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        class="h-5 w-5"
        viewBox="0 0 24 24"
        fill="none"
      >
        <path
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2 9h14l-2-9M10 21a1 1 0 1 1-2 0 1 1 0 0 1 2 0Zm8 0a1 1 0 1 1-2 0 1 1 0 0 1 2 0Z"
        />
      </svg>
      <span class="hidden sm:inline">Cart</span>

      <span
        class="absolute -top-1 -right-1 bg-red-500 text-white text-xs w-5 h-5 flex items-center justify-center rounded-full"
      >
        2
      </span>
    </a>
  </div>

  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-2">
    <div
      class="flex flex-col md:flex-row md:items-center md:justify-between gap-2"
    >
      <div class="relative inline-block text-left">
        <button
          type="button"
          class="inline-flex justify-center items-center gap-2 w-full rounded-md border px-4 py-2 bg-white text-sm font-medium hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-gray-900"
          (click)="toggleDropdown()"
        >
          Categories
          <svg
            class="w-4 h-4"
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M19 9l-7 7-7-7"
            />
          </svg>
        </button>

        <div
          *ngIf="dropdownOpen"
          class="absolute left-0 mt-2 w-48 rounded-md shadow-lg bg-white ring-1 ring-black ring-opacity-5 z-50"
        >
          <ul class="py-1 max-h-60 overflow-y-auto">
            <li *ngFor="let cat of categories">
              <a
                [routerLink]="['/category', cat.categoryName | lowercase]"
                class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100"
              >
                {{ cat.categoryName }}
              </a>
            </li>
          </ul>
        </div>
      </div>

      <nav aria-label="Breadcrumb" class="text-sm text-gray-600">
        <ol class="flex items-center gap-1 flex-wrap">
          <li
            *ngFor="let crumb of breadcrumb; let last = last"
            class="flex items-center gap-1"
          >
            <ng-container *ngIf="!last && crumb.url; else current">
              <a [routerLink]="crumb.url" class="hover:underline">{{
                crumb.label
              }}</a>
            </ng-container>
            <ng-template #current>
              <span
                class="font-medium text-gray-900"
                [attr.aria-current]="last ? 'page' : null"
                >{{ crumb.label }}</span
              >
            </ng-template>
            <span *ngIf="!last" class="px-1 text-gray-400">/</span>
          </li>
        </ol>
      </nav>
    </div>
  </div>
</header>
