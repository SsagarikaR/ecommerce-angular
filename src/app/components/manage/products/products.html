<div class="px-40 mt-10">
  <div class="shadow">
    <div class="flex justify-between items-center mb-2">
      <h1 class="text-2xl font-extrabold">Manage Products</h1>
      <button
        class="px-2 py-2 bg-blue-400 rounded-lg hover:bg-blue-300 cursor-pointer"
        [routerLink]="['/admin/products/add']"
      >
        Add new Product
      </button>
    </div>
    <mat-form-field class="w-full">
      <mat-label>Filter</mat-label>
      <input
        matInput
        (keyup)="applyFilter($event)"
        placeholder="Search"
        #input
      />
    </mat-form-field>

    <table mat-table [dataSource]="dataSource" matSort>
      <!-- ID Column -->
      <ng-container matColumnDef="productThumbnail">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>
          productThumbnail
        </th>
        <td mat-cell *matCellDef="let row">
          <img [src]="row.productThumbnail" class="w-12 h-12" />
        </td>
      </ng-container>

      <!-- Name Column -->
      <ng-container matColumnDef="productName">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Name</th>
        <td mat-cell *matCellDef="let row">{{ row.productName }}</td>
      </ng-container>

      <!-- Fruit Column -->
      <ng-container matColumnDef="action">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Action</th>
        <td mat-cell *matCellDef="let row">
          <button
            matIconButton
            [routerLink]="['/admin/products/', row.productID]"
          >
            ✏️</button
          ><button matIconButton (click)="delete(row.productID)">🗑️</button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>

      <!-- Row shown when there is no matching data. -->
      <tr class="mat-row" *matNoDataRow>
        <td class="mat-cell" colspan="4">
          No data matching the filter "{{ input.value }}"
        </td>
      </tr>
    </table>

    <mat-paginator
      [pageSizeOptions]="[5, 10, 25, 100]"
      aria-label="Select page of users"
    ></mat-paginator>
  </div>
</div>
