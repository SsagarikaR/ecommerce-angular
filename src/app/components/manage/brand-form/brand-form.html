<div class="flex flex-col items-center px-40 mt-10">
  @if(isEdit){
  <h1 class="text-2xl font-extrabold">Update Category</h1>
  }@else{
  <h1 class="text-2xl font-extrabold">Add New Category</h1>
  }
  <form class="shadow-sm w-96 p-4">
    <div class="flex flex-wrap">
      <div class="w-full gap-4">
        <mat-form-field class="w-full flex flex-col">
          <div class="border pl-2 pt-2 mb-2">
            <mat-label>Name</mat-label>
            <input
              matInput
              type="text"
              [(ngModel)]="brandName"
              name="brandName"
            />
          </div>
        </mat-form-field>
        <mat-form-field class="w-full flex flex-col">
          <div class="border pl-2 pt-2">
            <mat-label>ThumbNail</mat-label>
            <input
              matInput
              type="text"
              [(ngModel)]="brandThumbnail"
              name="brandThumbnail"
            />
          </div>
        </mat-form-field>
      </div>
      <div class="w-full flex justify-center">
        @if(isEdit){<button
          class="px-6 py-2 font-semibold bg-blue-400 rounded-lg hover:bg-blue-300 cursor-pointer"
          (click)="update()"
          [disabled]="!brandName || !brandThumbnail"
        >
          Update</button
        >} @else{
        <button
          class="px-6 py-2 font-semibold bg-blue-400 rounded-lg hover:bg-blue-300 cursor-pointer"
          (click)="add()"
          [disabled]="!brandName || !brandThumbnail"
        >
          Add</button
        >}
      </div>
    </div>
  </form>
</div>
