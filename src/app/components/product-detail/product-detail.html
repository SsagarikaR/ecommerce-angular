<div *ngIf="loading" class="p-6 text-center text-gray-500">
  Loading product...
</div>

<div
  *ngIf="!loading && product"
  class="max-w-6xl mx-auto p-6 grid grid-cols-1 lg:grid-cols-2 gap-10"
>
  <!-- LEFT: Image Gallery -->
  <div class="flex flex-col lg:flex-row gap-4">
    <!-- Thumbnails -->
    <div class="flex lg:flex-col gap-3 order-2 lg:order-1">
      <img
        *ngIf="product.productThumbnail"
        [src]="product.productThumbnail"
        (click)="selectedImage = product.productThumbnail"
        class="w-16 h-16 object-cover rounded-lg border cursor-pointer hover:opacity-80"
      />
      <img
        *ngIf="product.productImage1"
        [src]="product.productImage1"
        (click)="selectedImage = product.productImage1"
        class="w-16 h-16 object-cover rounded-lg border cursor-pointer hover:opacity-80"
      />
      <img
        *ngIf="product.productImage2"
        [src]="product.productImage2"
        (click)="selectedImage = product.productImage2"
        class="w-16 h-16 object-cover rounded-lg border cursor-pointer hover:opacity-80"
      />
      <img
        *ngIf="product.productImage3"
        [src]="product.productImage3"
        (click)="selectedImage = product.productImage3"
        class="w-16 h-16 object-cover rounded-lg border cursor-pointer hover:opacity-80"
      />
    </div>

    <!-- Main Image -->
    <div class="flex-1 order-1 lg:order-2">
      <img
        [src]="selectedImage || product.productThumbnail"
        alt="{{ product.productName }}"
        class="w-full max-h-[500px] object-contain rounded-lg shadow"
      />
    </div>
  </div>

  <!-- RIGHT: Product Info -->
  <div class="space-y-6">
    <div class="flex justify-between items-start">
      <h1 class="text-3xl font-bold">{{ product.productName }}</h1>
      <app-wish-list
        [isWishlisted]="product.wishlist === 'yes'"
        [wishlistID]="product.wishListID"
        (toggle)="toggleWishlist($event)"
        [productID]="product.productID"
      ></app-wish-list>
    </div>

    <p class="text-gray-600 leading-relaxed">
      {{ product.productDescription }}
    </p>

    <!-- Price -->
    <div class="text-2xl font-semibold text-green-600">
      ₹{{ product.productPrice }}
    </div>

    <!-- Stock / Category -->
    <div class="flex items-center text-sm text-gray-500 space-x-4">
      <span>Category: {{ product.categoryName }}</span>
      <span *ngIf="product.stock > 0" class="text-green-500 font-medium">
        In Stock ({{ product.stock }})
      </span>
      <span *ngIf="product.stock === 0" class="text-red-500 font-medium">
        Out of Stock
      </span>
    </div>

    <!-- Add to Cart -->
    <button
      class="w-full py-3 bg-black text-white rounded-lg text-lg font-medium hover:bg-black transition"
      (click)="addToCart(product)"
    >
      Add to Cart
    </button>
  </div>
</div>
