<header class="w-full sticky top-0 z-50 bg-white border-b border-slate-200">
  <div
    class="max-w-7xl mx-auto px-6 py-3 flex items-center justify-between gap-4"
  >
    <!--  logo  -->
    <a routerLink="/" class="flex items-center gap-2">
      <div
        class="w-8 h-8 rounded-full bg-slate-600 flex items-center justify-center"
      ></div>
      <span class="font-bold text-lg text-slate-900">ShopMate</span>
    </a>

    <!--  search bar -->
    <form
      class="flex-1 max-w-2xl"
      (submit)="$event.preventDefault(); onSearch(searchInput.value)"
      role="search"
    >
      <div class="flex border border-slate-300 rounded-lg overflow-hidden">
        <input
          #searchInput
          type="search"
          placeholder="Search for products, brands and more..."
          class="w-full px-4 py-2 outline-none"
        />
        <button
          type="submit"
          class="px-4 py-2 bg-slate-500 hover:bg-slate-400 text-white"
          aria-label="Search ShopMate products"
        >
          <svg
            class="h-4 w-4"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="m21 21-4.35-4.35M10.5 18a7.5 7.5 0 1 1 0-15 7.5 7.5 0 0 1 0 15Z"
            />
          </svg>
        </button>
      </div>
    </form>

    <!-- Added click handler and dropdown menu for profile -->
    <div class="flex">
      <div class="relative">
        <button
          (click)="toggleProfileDropdown()"
          class="flex items-center md:gap-2 px-3 py-2 rounded hover:bg-slate-50"
          [attr.aria-expanded]="profileDropdownOpen"
        >
          <div
            class="w-6 h-6 rounded-full bg-emerald-700 flex items-center justify-center"
          >
            <svg
              class="h-3 w-3 text-white"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M16 7a4 4 0 1 1-8 0 4 4 0 0 1 8 0ZM4 20a8 8 0 1 1 16 0v1H4v-1Z"
              />
            </svg>
          </div>
          <span class="text-sm md:block hidden">Profile</span>
          <svg
            class="w-4 h-4 text-slate-400"
            fill="currentColor"
            viewBox="0 0 20 20"
          >
            <path
              fill-rule="evenodd"
              d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z"
              clip-rule="evenodd"
            />
          </svg>
        </button>

        <!-- Profile dropdown menu -->
        <div
          *ngIf="profileDropdownOpen"
          class="absolute right-0 mt-1 w-48 bg-white border border-slate-200 rounded shadow-lg z-50"
        >
          <ul class="py-1">
            <li *ngIf="isAdmin">
              <a
                routerLink="/admin/categories"
                class="block px-4 py-2 text-sm text-slate-700 hover:bg-slate-50"
                role="menu"
              >
                Dashboard
              </a>
            </li>
            <li>
              <a
                routerLink="/orders"
                class="block px-4 py-2 text-sm text-slate-700 hover:bg-slate-50"
                role="menuitem"
              >
                My Orders
              </a>
            </li>
            <li>
              <a
                routerLink="/wishlist"
                class="block px-4 py-2 text-sm text-slate-700 hover:bg-slate-50"
                role="menuitem"
              >
                Wishlist
              </a>
            </li>

            <li>
              <hr class="my-1 border-slate-200" />
            </li>
            <li>
              <button
                (click)="signOut()"
                class="block w-full text-left px-4 py-2 text-sm text-rose-600 hover:bg-slate-50"
                role="menuitem"
              >
                Sign Out
              </button>
            </li>
          </ul>
        </div>
      </div>
      <!-- cart button -->
      <button
        (click)="openCart()"
        class="flex items-center gap-2 md:px-3 py-2 rounded hover:bg-slate-50 relative"
        [attr.aria-label]="'Shopping Cart with ' + cartItems.length + ' items'"
      >
        <svg
          class="h-5 w-5 text-slate-700"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2 9h14l-2-9M10 21a1 1 0 1 1-2 0 1 1 0 0 1 2 0Zm8 0a1 1 0 1 1-2 0 1 1 0 0 1 2 0Z"
          />
        </svg>
        <span class="text-sm md:block hidden">Cart</span>
        <span
          *ngIf="cartItems.length > 0"
          class="absolute -top-1 -right-1 bg-rose-500 text-white text-xs w-5 h-5 flex items-center justify-center rounded-full"
          aria-hidden="true"
        >
          {{ cartItems.length }}
        </span>
      </button>
    </div>
  </div>

  <div class="border-t border-slate-100 bg-slate-50">
    <div class="max-w-7xl mx-auto px-6 py-2 flex items-center justify-between">
      <!--  categories dropdown -->
      <div class="relative">
        <button
          (click)="toggleDropdown()"
          class="flex items-center gap-2 px-3 py-2 text-sm border border-slate-300 rounded bg-white hover:bg-slate-50"
        >
          <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20">
            <path
              d="M3 4a1 1 0 011-1h12a1 1 0 011 1v2a1 1 0 01-1 1H4a1 1 0 01-1-1V4zM3 10a1 1 0 011-1h6a1 1 0 011 1v6a1 1 0 01-1 1H4a1 1 0 01-1-1v-6zM7 13l-2 9h14l-2-9M10 21a1 1 0 1 1-2 0 1 1 0 0 1 2 0Zm8 0a1 1 0 1 1-2 0 1 1 0 0 1 2 0Z"
            />
          </svg>
          Categories
          <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20">
            <path
              fill-rule="evenodd"
              d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z"
              clip-rule="evenodd"
            />
          </svg>
        </button>

        <div
          *ngIf="dropdownOpen"
          class="absolute left-0 mt-1 w-48 bg-white border border-slate-200 rounded shadow-lg z-50"
        >
          <ul class="py-1">
            <li *ngFor="let cat of categories">
              <a
                [routerLink]="['/products']"
                [queryParams]="{ categoryID: cat.categoryID }"
                class="block px-4 py-2 text-sm text-slate-700 hover:bg-slate-50"
              >
                {{ cat.categoryName }}
              </a>
            </li>
          </ul>
        </div>
      </div>

      <!-- breadcrumb -->
      <nav class="text-sm">
        <ol
          *ngIf="breadcrumb && breadcrumb.length > 1"
          class="flex items-center gap-1"
        >
          <li
            *ngFor="let crumb of breadcrumb; let last = last"
            class="flex items-center gap-1"
          >
            <a
              *ngIf="!last && crumb.url; else current"
              [routerLink]="crumb.url"
              class="text-slate-600 hover:text-slate-900"
            >
              {{ crumb.label }}
            </a>
            <ng-template #current>
              <span class="text-slate-900 font-medium">{{ crumb.label }}</span>
            </ng-template>
            <svg
              *ngIf="!last"
              class="w-3 h-3 text-slate-400"
              fill="currentColor"
              viewBox="0 0 20 20"
            >
              <path
                fill-rule="evenodd"
                d="M7.293 14.707a1 1 0 010-1.414L10.586 10 7.293 6.707a1 1 0 011.414-1.414l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414 0z"
                clip-rule="evenodd"
              />
            </svg>
          </li>
        </ol>
      </nav>
    </div>
  </div>
</header>
