<div
  class="shadow rounded-xl border p-3 hover:shadow-lg transition w-full h-full flex flex-col justify-between relative"
>
  <div class="absolute top-4 right-4">
    <app-wish-list
      [isWishlisted]="item.wishlist === 'yes'"
      [wishlistID]="item.wishListID"
      (toggle)="toggleWishlist($event)"
      [productID]="item.productID"
    ></app-wish-list>
  </div>
  <div
    class="w-full h-50 bg-gray-100 flex items-center justify-center rounded-lg"
    [routerLink]="['/products', item.productID]"
  >
    <img
      *ngIf="item.productThumbnail"
      [src]="item.productThumbnail"
      [alt]="item.productName"
      class="max-h-full max-w-full object-contain"
    />
  </div>

  <div class="mt-3" [routerLink]="['/products', item.productID]">
    <h5 class="font-semibold text-gray-800 truncate">{{ item.productName }}</h5>

    <p class="text-sm text-gray-500">
      {{
        isExpanded
          ? item.productDescription
          : (item.productDescription | slice : 0 : 60) +
            (hasLongDescription ? "..." : "")
      }}
      <button
        *ngIf="hasLongDescription"
        (click)="toggleDescription()"
        class="text-blue-600 text-xs mt-1 hover:underline"
      >
        {{ isExpanded ? "Read less" : "Read more" }}
      </button>
    </p>

    <p class="font-bold text-gray-900 mt-1">₹{{ item.productPrice }}</p>
  </div>

  <button
    class="mt-2 w-full bg-gray-900 text-white text-sm py-1.5 rounded-lg hover:bg-gray-700"
  >
    Add to Cart
  </button>
</div>
