<div
  class="group relative flex h-full w-full flex-col justify-between overflow-hidden rounded-xl border border-slate-200 bg-white p-3 shadow-sm transition hover:-translate-y-0.5 hover:shadow-md">
  <div class="absolute right-3 top-3 z-10">
    <app-wish-list [isWishlisted]="item.wishlist === 'yes'" [wishlistID]="item.wishListID"
      (wishlistToggle)="toggleWishlist($event)" [productID]="item.productID"></app-wish-list>
  </div>

  <a class="block focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-emerald-600 rounded-lg"
    [routerLink]="['/products', item.productID]">
    <div class="flex h-48 w-full items-center justify-center rounded-lg bg-slate-50">
      <img *ngIf="item.productThumbnail" [src]="item.productThumbnail" [alt]="item.productName"
        class="max-h-full max-w-full object-contain transition-transform duration-300 group-hover:scale-[1.02]" />
    </div>
  </a>

  <a class="mt-3 block focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-emerald-600 rounded"
    [routerLink]="['/products', item.productID]">
    <h3 class="font-semibold text-slate-900 truncate" title="{{ item.productName }}">
      {{ item.productName }}
    </h3>
  </a>

  <p class="mt-1 text-sm text-slate-600">
    {{
    isExpanded
    ? item.productDescription
    : (item.productDescription | slice : 0 : 100) +
    (hasLongDescription ? "..." : "")
    }}
    <button *ngIf="hasLongDescription" (click)="toggleDescription()"
      class="ml-1 inline-flex items-center text-emerald-600 hover:text-emerald-700 text-xs font-medium focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-emerald-600 rounded"
      type="button">
      {{ isExpanded ? "Read less" : "Read more" }}
    </button>
  </p>

  <div class="mt-2 flex items-center justify-between">
    <p class="text-lg font-bold text-slate-900">₹{{ item.productPrice }}</p>
  </div>

  <div class="mt-3">
    <app-add-to-cart-button [item]="item"></app-add-to-cart-button>
  </div>
</div>
