<div>
  <div>
    <owl-carousel-o [options]="customOptions">
      @for(category of categories; track $index){
      <ng-template carouselSlide>
        <div
          class="relative flex flex-col items-center"
          [routerLink]="'categories/' + category.categoryID"
        >
          <img
            class="h-[400px]"
            [src]="category.categoryThumbnail"
            alt="{{ category.categoryName }}"
          />
          <span>{{ category.categoryName }}</span>
        </div></ng-template
      >
      }
    </owl-carousel-o>
  </div>
  <h4 class="text-2xl font-bold mb-2">Featured Products</h4>

  <div
    class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 xl:grid-cols-5 gap-4 mb-10"
  >
    @for (product of products; track $index) {
    <app-product-card [item]="product"></app-product-card>
    }
  </div>

  <h4 class="text-2xl font-bold mb-2">Featured Products</h4>

  <div
    class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 xl:grid-cols-5 gap-4"
  >
    @for (preference of preferences; track $index) {
    <app-product-card [item]="preference"></app-product-card>
    }
  </div>
</div>
