<div class="container mx-auto p-6">
  <div class="bg-white rounded-lg shadow-lg p-6 md:p-8 border border-slate-200">
    <div class="mb-6 border-b border-slate-200 pb-4">
      <h1 class="text-3xl font-bold text-slate-900">
        {{ isEdit ? "Update Brand" : "Add New Brand" }}
      </h1>
      <p class="text-slate-600 mt-1">
        {{
          isEdit
            ? "Edit brand details below."
            : "Fill in the details to add a new brand."
        }}
      </p>
    </div>
    <form class="space-y-6">
      <div class="grid grid-cols-1 md:grid-cols-1 gap-6">
        <div class="flex flex-col space-y-1">
          <label for="rating" class="text-sm font-medium text-slate-700"
            >Name</label
          >
          <input
            id="brandName"
            type="text"
            placeholder="e.g., Nike, Adidas"
            [(ngModel)]="brandName"
            name="brandName"
            required
            class="px-3 py-2 border border-slate-300 rounded-md focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500"
          />
        </div>

        <div class="md:col-span-1">
          <label class="block text-sm font-medium text-slate-700 mb-2"
            >Brand Thumbnail</label
          >
          <app-cloudinary-upload-component
            [config]="cloudinaryConfig"
            name="brandThumbnail"
            placeholder="Upload Thumbnail image"
            [showInfo]="true"
            [imageUrl]="brandThumbnail"
            (uploadSuccess)="brandThumbnail = $event.url"
          ></app-cloudinary-upload-component>
        </div>
      </div>
    </form>
    <div class="mt-8 flex justify-end gap-4">
      <button
        (click)="cancel()"
        class="border-slate-400 border text-slate-600 hover:bg-slate-50 focus:bg-slate-100 px-5 py-3 rounded-full font-medium"
      >
        Cancel
      </button>
      <button
        (click)="saveBrand()"
        [disabled]="!brandName || !brandThumbnail"
        class="bg-slate-600 hover:bg-slate-500 focus:bg-slate-500 disabled:bg-slate-400 text-white px-5 py-3 rounded-full font-medium"
      >
        {{ isEdit ? "Update Brand" : "Add Brand" }}
      </button>
    </div>
  </div>
</div>
