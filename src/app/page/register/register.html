<div class="flex items-center justify-center min-h-screen bg-slate-50">
  <div
    class="w-full max-w-md bg-white shadow-lg rounded-2xl p-6 border border-slate-200"
  >
    <h2 class="text-2xl font-bold text-center text-slate-800 mb-6">Register</h2>

    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="space-y-4">
      <!-- Name -->
      <div>
        <label for="name" class="block text-sm font-medium text-slate-700"
          >Name</label
        >
        <input
          id="name"
          type="text"
          formControlName="name"
          placeholder="Enter your name"
          class="mt-1 block w-full rounded-lg border border-slate-300 px-3 py-2 focus:ring-2 focus:ring-salate-500 focus:outline-none"
        />
        <p
          class="text-rose-500 text-xs mt-1"
          *ngIf="
            registerForm.get('name')?.touched &&
            registerForm.get('name')?.invalid
          "
        >
          Name must be at least 3 characters.
        </p>
      </div>

      <!-- Email -->
      <div>
        <label for="Email" class="block text-sm font-medium text-slate-700"
          >Email</label
        >
        <input
          id="Email"
          type="email"
          formControlName="email"
          placeholder="Enter your email"
          class="mt-1 block w-full rounded-lg border border-slate-300 px-3 py-2 focus:ring-2 focus:ring-salate-500 focus:outline-none"
        />
        <p
          class="text-rose-500 text-xs mt-1"
          *ngIf="
            registerForm.get('email')?.touched &&
            registerForm.get('email')?.invalid
          "
        >
          Please enter a valid email.
        </p>
      </div>

      <!-- Contact No -->
      <div>
        <label for="contactNo" class="block text-sm font-medium text-slate-700"
          >Contact No</label
        >
        <input
          id="contactNo"
          type="text"
          formControlName="contactNo"
          placeholder="Enter your contact number"
          class="mt-1 block w-full rounded-lg border border-slate-300 px-3 py-2 focus:ring-2 focus:ring-salate-500 focus:outline-none"
        />
        <p
          class="text-rose-500 text-xs mt-1"
          *ngIf="
            registerForm.get('contactNo')?.touched &&
            registerForm.get('contactNo')?.invalid
          "
        >
          Contact number must be 10 digits.
        </p>
      </div>

      <!-- Password -->
      <div>
        <label for="password" class="block text-sm font-medium text-slate-700"
          >Password</label
        >
        <input
          id="password"
          type="password"
          formControlName="password"
          placeholder="Enter your password"
          class="mt-1 block w-full rounded-lg border border-slate-300 px-3 py-2 focus:ring-2 focus:ring-salate-500 focus:outline-none"
        />
        <p
          class="text-rose-500 text-xs mt-1"
          *ngIf="
            registerForm.get('password')?.touched &&
            registerForm.get('password')?.invalid
          "
        >
          Password must be at least 6 characters.
        </p>
      </div>

      <!-- Submit -->
      <button
        type="submit"
        [disabled]="registerForm.invalid"
        class="w-full bg-slate-600 text-white py-2 rounded-lg font-medium hover:bg-slate-500 disabled:bg-slate-400 disabled:cursor-not-allowed transition"
      >
        Register
      </button>
    </form>
    <div class="text-center mt-6 pt-4 border-t border-slate-100">
      <p class="text-sm text-slate-600">
        Already have an account?
        <a
          [routerLink]="['/login']"
          class="text-slate-600 hover:text-slate-700 font-semibold cursor-pointer transition duration-150 ease-in-out hover:underline"
        >
          Login here
        </a>
      </p>
    </div>
  </div>
</div>
