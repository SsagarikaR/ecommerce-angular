<div class="flex justify-center items-center min-h-screen bg-slate-50">
  <div
    class="bg-white p-6 rounded-2xl shadow-md w-full max-w-sm border border-slate-200"
  >
    <h2 class="text-2xl font-semibold text-center mb-4 text-slate-900">
      Login
    </h2>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-4">
      <!-- Email -->
      <div>
        <label class="block text-sm font-medium text-slate-700">Email</label>
        <input
          type="email"
          formControlName="email"
          class="mt-1 block w-full rounded-lg border border-slate-300 p-2 focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500"
        />
        <p
          *ngIf="
            loginForm.controls['email'].invalid &&
            loginForm.controls['email'].touched
          "
          class="text-rose-500 text-sm mt-1"
        >
          Enter a valid email
        </p>
      </div>

      <!-- Password -->
      <div>
        <label class="block text-sm font-medium text-slate-700">Password</label>
        <input
          type="password"
          formControlName="password"
          class="mt-1 block w-full rounded-lg border border-slate-300 p-2 focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500"
        />
        <p
          *ngIf="
            loginForm.controls['password'].invalid &&
            loginForm.controls['password'].touched
          "
          class="text-rose-500 text-sm mt-1"
        >
          Password must be at least 6 characters
        </p>
      </div>

      <button
        type="submit"
        [disabled]="loginForm.invalid"
        class="w-full bg-slate-600 text-white py-2 px-4 rounded-lg hover:bg-slate-500 disabled:opacity-50"
      >
        Login
      </button>
    </form>
  </div>
</div>
