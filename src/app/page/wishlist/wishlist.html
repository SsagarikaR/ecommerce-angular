<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
  <h2 class="text-2xl font-bold mb-6 text-slate-900">My Wishlist</h2>

  <!-- Loading -->
  <div *ngIf="loading" class="text-center py-10 text-slate-500">
    Loading your wishlist...
  </div>

  <!-- Empty state -->
  <div *ngIf="!loading && wishlist.length === 0" class="text-center py-10">
    <p class="text-slate-500 mb-4">Your wishlist is empty</p>
    <a
      routerLink="/products"
      class="px-4 py-2 rounded-lg bg-slate-600 hover:bg-slate-500 text-white"
    >
      Browse Products
    </a>
  </div>

  <!-- Wishlist list -->
  <div *ngIf="!loading && wishlist.length > 0" class="space-y-4">
    <div
      *ngFor="let item of wishlist"
      class="flex items-center justify-between border border-slate-200 rounded-xl p-4 shadow-sm hover:shadow-md transition"
    >
      <!-- Left: Product image -->
      <div
        [routerLink]="['/products', item.productID]"
        class="flex items-center gap-4 cursor-pointer"
      >
        <img
          [src]="item.productThumbnail || 'https://via.placeholder.com/100'"
          alt="{{ item.productName }}"
          class="w-20 h-20 object-cover rounded-lg"
        />
        <div>
          <h3 class="font-semibold text-sm mb-1 text-slate-900">
            {{ item.productName }}
          </h3>
          <p class="text-slate-500 text-xs">Price: ${{ item.productPrice }}</p>
          <p *ngIf="item.stock" class="text-slate-400 text-xs">
            Stock: {{ item.stock }}
          </p>
          <p *ngIf="item.size" class="text-slate-400 text-xs">
            Size: {{ item.size }}
          </p>
        </div>
      </div>

      <!-- Right: Price + Actions -->
      <div class="flex items-center gap-4">
        <div class="text-right">
          <p class="font-semibold text-slate-900">${{ item.productPrice }}</p>
        </div>

        <!-- Actions -->
        <div class="flex items-center gap-2">
          <button
            class="p-2 rounded-lg border border-slate-300 hover:bg-slate-50 cursor-pointer text-slate-600"
            title="Move to cart"
            (click)="addToCart(item)"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              class="h-5 w-5"
              viewBox="0 0 24 24"
              fill="none"
            >
              <path
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2 9h14l-2-9M10 21a1 1 0 1 1-2 0 1 1 0 0 1 2 0Zm8 0a1 1 0 1 1-2 0 1 1 0 0 1 2 0Z"
              />
            </svg>
          </button>
          <button
            (click)="removeItem(item.wishListID)"
            class="p-2 rounded-lg border border-slate-300 hover:bg-slate-50 text-rose-500 cursor-pointer"
            title="Remove"
          >
            ✕
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
